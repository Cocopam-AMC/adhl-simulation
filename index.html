<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3947" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="IMU Scenario" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>IMU Scenario Simulation</title>
  <style>
    :root{--navy:#103846;--teal:#20a99d;--purple:#6e54b8;--bg:#fbf7fd;--card:#f0edf2;--text:#201e23;--muted:#6b6670;--danger:#b83d52;--ok:#15816f;--line:#e4dee7}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:820px;margin:0 auto;min-height:100dvh;padding:18px 20px calc(28px + env(safe-area-inset-bottom))}
    .top{background:var(--navy);color:#fff;margin:-18px -20px 24px;padding:20px 22px;border-bottom:3px solid var(--teal)}
    .top h1{margin:0;font-size:25px}.top small{opacity:.84}
    .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 14px rgba(30,20,40,.05)}
    label{display:block;font-weight:800;margin:12px 0 7px} input,select{width:100%;font-size:18px;padding:13px 14px;border:1px solid #cfc7d2;border-radius:12px;background:#fff}
    .seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg button,.btn{border:0;border-radius:16px;padding:16px;font-size:20px;font-weight:800;cursor:pointer}
    .seg button{background:#e7e3ea;color:#333}.seg button.active{background:var(--teal);color:#fff}.btn{width:100%;background:var(--purple);color:#fff;margin-top:14px}.btn.secondary{background:#e7e3ea;color:#302b34}.btn.danger{background:#fff;color:var(--danger);border:1px solid #e4bec6}
    .utilityRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}.utilityBtn{border:1px solid #cec6d2;background:#fff;color:#40394a;border-radius:14px;padding:13px;font-size:17px;font-weight:800}.utilityBtn:disabled{opacity:.35}
    .muted{color:var(--muted)}.center{text-align:center}.hidden{display:none!important}.note{font-size:14px;color:var(--muted);line-height:1.55}.ok{color:var(--ok);font-weight:800}
    .scenarioGrid{display:grid;gap:10px;margin-top:12px}.scenarioCard{border:1px solid #d8d0db;border-radius:15px;padding:14px;background:#fff}.scenarioCard b{font-size:19px}.scenarioTitle{font-size:22px;font-weight:900;color:var(--navy)}
    .coverage{margin-top:12px;background:#edf9f6;border:1px solid #b7e2da;border-radius:14px;padding:13px}.coverage strong{font-size:18px}
    .progress{font-size:20px;margin-bottom:10px}.scenarioProgress{font-size:18px;color:var(--teal);font-weight:800;margin-bottom:18px}
    .activity-title{font-size:clamp(32px,7vw,54px);line-height:1.1;font-weight:900;text-align:center;margin:24px 0 12px;overflow-wrap:anywhere}.category{font-size:23px;color:#6c568f;text-align:center;margin-bottom:18px}.binary{font-size:17px;text-align:center;margin:-8px 0 18px;color:var(--teal);font-weight:800}
    .instruction{font-size:clamp(21px,4.2vw,31px);line-height:1.5;background:var(--card);padding:20px;border-radius:18px;text-align:center}.target{font-size:25px;font-weight:800;text-align:center;margin:24px 0}.countdown{font-size:100px;line-height:1;font-weight:900;text-align:center;color:var(--purple);margin:30px 0}.timer{font-size:66px;text-align:center;font-variant-numeric:tabular-nums;font-weight:800;margin:22px 0}.status{font-size:22px;text-align:center;font-weight:800;margin:14px 0;color:var(--ok)}
    .pauseBanner{background:#fff0c9;border:1px solid #e9c96c;color:#6a5311;border-radius:14px;padding:14px;text-align:center;font-size:20px;font-weight:800;margin:12px 0}.footer{margin-top:18px;text-align:center}
    .summaryList{font-size:17px;line-height:1.8}.pill{display:inline-block;background:#e9f7f5;color:#126d64;border-radius:999px;padding:4px 10px;font-weight:800;margin:3px}
    @media(max-width:560px){.utilityRow{grid-template-columns:1fr}.top h1{font-size:22px}}

</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>IMU 통합 시나리오</h1><small>모빌리티 모니터링 연구 · A–J 최신 통합 시나리오 지시 앱</small></header>

  <section id="setup">
    <div class="card">
      <label for="subjectId">대상자 ID</label>
      <input id="subjectId" placeholder="예: P001" autocomplete="off" />

      <label>수행 시나리오 수</label>
      <div class="seg">
        <button id="count3Btn" class="active" type="button">3개</button>
        <button id="count4Btn" type="button">4개</button>
      </div>

      <label for="voiceOn">음성 안내</label>
      <select id="voiceOn"><option value="on" selected>사용</option><option value="off">사용 안 함</option></select>

      <button class="btn" id="generateScenarios">시나리오 랜덤 선택</button>
    </div>
    <div class="card note">
      <b>선택 원칙</b><br>
      A–J 중 선택한 개수(3개 또는 4개)의 시나리오를 무작위로 고릅니다. 단, 선택된 시나리오 전체에 필수 동작 17종이 모두 최소 1회 포함되는 조합만 사용합니다.<br>
      시나리오 수행 순서는 무작위이며, 각 시나리오 내부 동작 순서는 원래 흐름대로 고정됩니다.
    </div>
  </section>

  <section id="previewScreen" class="hidden">
    <div class="card">
      <div class="scenarioTitle">오늘 선택된 시나리오</div>
      <div id="scenarioPreview" class="scenarioGrid"></div>
      <div id="coverageBox" class="coverage"></div>
      <button class="btn secondary" id="rerollBtn">다시 랜덤 선택</button>
      <button class="btn" id="confirmStart">선택 완료 / 실험 시작</button>
    </div>
  </section>

  <section id="activityScreen" class="hidden">
    <div class="scenarioProgress" id="scenarioProgress"></div>
    <div class="progress" id="progress"></div>
    <div class="utilityRow"><button class="utilityBtn" id="prevActivityBtn" type="button">← 이전 동작</button><button class="utilityBtn" id="pauseActivityBtn" type="button">⏸ 일시정지</button></div>
    <div id="pauseBanner" class="pauseBanner hidden">일시정지 중</div>
    <div class="activity-title" id="activityName"></div>
    <div class="category" id="activityCategory"></div>
    <div class="binary" id="binaryLabel"></div>
    <div class="instruction" id="activityInstruction"></div>
    <div class="target" id="activityTarget"></div>

    <div id="readyPanel"><button class="btn" id="readyStart">동작 시작</button></div>
    <div id="runningPanel" class="hidden"><div class="timer" id="timer"></div><div class="status" id="runningStatus">동작 진행 중</div><button class="btn" id="manualComplete">동작 완료</button></div>
    <div class="footer"><button class="btn danger" id="abortSession">실험 종료</button></div>
  </section>

  <section id="finishScreen" class="hidden">
    <div class="card center"><h2>실험이 완료되었습니다.</h2><p class="muted">선택 시나리오, 수행 순서, 동작별 시작/종료 시각과 Mobility 라벨이 CSV에 저장됩니다.</p><button class="btn" id="downloadCsv">CSV 저장</button><button class="btn secondary" id="newSession">새 실험 시작</button></div>
  </section>
</div>
<script src="./app.js"></script>
</body>
</html>
